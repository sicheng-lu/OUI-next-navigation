                  - img [ref=e172]
                - heading [level=4] [ref=e1015]: BLINK
                - paragraph [ref=e184]:
                  - strong [ref=e185]: Ack / Listening
                - paragraph [ref=e188]: A brief close-and-open. Signals the mascot heard you.
              - generic [ref=e190]:
                - img [ref=e1016]:
                  - img [ref=e192]
                - heading [level=4] [ref=e1017]: DOT
                - paragraph [ref=e204]:
