                - heading [level=4] [ref=e1013]: COMMA
                - paragraph [ref=e164]:
                  - strong [ref=e165]: Rest / Idle / Streaming
                - paragraph [ref=e168]: The default resting state. Eyes relaxed, body neutral.
              - generic [ref=e170]:
