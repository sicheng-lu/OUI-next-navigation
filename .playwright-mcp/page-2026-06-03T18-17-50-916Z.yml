          - heading "D · Micro-moments" [level=2] [ref=e1165]
          - paragraph [ref=e585]: Small opinions on the in-betweens.
          - generic [ref=e587]:
            - generic [ref=e589]:
              - img "mascot · happy" [ref=e1166]:
                - img [ref=e592]
              - heading "One beat of happy, never two" [level=4] [ref=e1167]
              - paragraph [ref=e603]: On 'found', the eye flips to ^ ^ for 280ms with a subtle 4px hop, then resolves to wink. Repeating it more than once turns it into a tic. Once is satisfying; twice is annoying.
            - generic [ref=e605]:
              - img "mascot · wow" [ref=e1168]:
                - img [ref=e608]
              - heading "Gold body, never gold eye" [level=4] [ref=e1169]
              - paragraph [ref=e619]: The ONLY moment the body color changes is when a human is needed. After ~30s without response, the wow eye softens to dot — patient waiting. The gold body stays.
            - generic [ref=e621]:
              - img "mascot · xx" [ref=e1170]:
                - img [ref=e624]
              - heading "xx flashes, then returns to comma" [level=4] [ref=e1171]
              - paragraph [ref=e635]: X-eyes show for ~600ms after a tool failure, then settle back. The error itself lives in the message text — the mascot doesn't keep wearing it. The agent recovers.
            - generic [ref=e637]:
              - img "mascot · squint" [ref=e1172]:
                - img [ref=e640]
              - heading "Eyes follow data, not the cursor" [level=4] [ref=e1173]
              - paragraph [ref=e651]: During work, idle cursor-following is OFF. Eyes belong to the agent's attention, not the user's. Cursor-following turns back on only at idle, and only on the empty state.
            - generic [ref=e653]:
              - img "mascot · comma" [ref=e1174]:
                - img [ref=e656]
              - heading "Idle blinks, never sleeps" [level=4] [ref=e1175]
              - paragraph [ref=e667]: "At rest the mascot cycles micro-expressions: blink (40%), then dot/squint/happy/wow/wink. No xx in idle — sleeping AI is a lie. Cycle pauses while any tool runs."
            - generic [ref=e669]:
              - img "mascot · heart" [ref=e1176]:
                - img [ref=e672]
              - heading "Heart eye is earned" [level=4] [ref=e1177]
              - paragraph [ref=e683]: Reserved for when the USER acts — thumbs-up, pin-to-runbook, share. The agent never wears heart on its own. It's the user's affordance, not the agent's emotion.
          - heading "Principles" [level=2] [ref=e1178]
          - paragraph [ref=e689]: Six rules the mascot follows.
          - generic [ref=e693]:
            - strong [ref=e696]: "1."
            - strong [ref=e699]: One mascot per message
            - paragraph [ref=e702]: Never show multiple mascots in the same context.
          - generic [ref=e706]:
            - strong [ref=e709]: "2."
            - strong [ref=e712]: Body is invariant
            - paragraph [ref=e715]: Only the eyes change. The body shape stays constant.
          - generic [ref=e719]:
            - strong [ref=e722]: "3."
            - strong [ref=e725]: Scale signals urgency
            - paragraph [ref=e728]: Bigger means more important. Smaller means background.
          - generic [ref=e732]:
            - strong [ref=e735]: "4."
            - strong [ref=e738]: State follows the current tool
            - paragraph [ref=e741]: The expression maps to what the agent is doing right now.
          - generic [ref=e745]:
            - strong [ref=e748]: "5."
            - strong [ref=e751]: Don't wear the result
            - paragraph [ref=e754]: The mascot reacts, then returns to neutral. It doesn't stay happy forever.
          - generic [ref=e758]:
            - strong [ref=e761]: "6."
            - strong [ref=e764]: Gold means human-needed
            - paragraph [ref=e767]: The only time the body color changes is when the agent needs your input.