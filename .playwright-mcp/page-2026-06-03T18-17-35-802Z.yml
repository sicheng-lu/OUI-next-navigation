        - heading "Agentic Mascot Guidelines" [level=1] [ref=e923]
      - main [ref=e137]:
        - generic [ref=e138]:
          - paragraph [ref=e140]: The OpenSearch mascot is a single circular character with comma-shaped eyes. It communicates agent state through nine eye expressions and a scale ladder from 18px to 96px. The body never morphs — only the eyes change. Color shifts to gold only when the agent needs human input.
          - heading "A · Vocabulary" [level=2] [ref=e924]
          - paragraph [ref=e146]: One body, nine expressions — the alphabet the mascot uses.
          - generic [ref=e148]:
            - generic [ref=e150]:
              - img "mascot · comma" [ref=e925]:
                - img [ref=e152]
              - heading "COMMA" [level=4] [ref=e926]
              - paragraph [ref=e164]:
                - strong [ref=e165]: Rest / Idle / Streaming
              - paragraph [ref=e168]: The default resting state. Eyes relaxed, body neutral.
            - generic [ref=e170]:
              - img "mascot · blink" [ref=e927]:
                - img [ref=e172]
              - heading "BLINK" [level=4] [ref=e928]
              - paragraph [ref=e184]:
                - strong [ref=e185]: Ack / Listening
              - paragraph [ref=e188]: A brief close-and-open. Signals the mascot heard you.
            - generic [ref=e190]:
              - img "mascot · dot" [ref=e929]:
                - img [ref=e192]
              - heading "DOT" [level=4] [ref=e930]
              - paragraph [ref=e204]:
                - strong [ref=e205]: Alert / Thinking / Tool call
              - paragraph [ref=e208]: Focused dot pupils. The mascot is processing.
            - generic [ref=e210]:
              - img "mascot · squint" [ref=e931]:
                - img [ref=e212]
              - heading "SQUINT" [level=4] [ref=e932]
              - paragraph [ref=e224]:
