          - heading "B · Lifecycle" [level=2] [ref=e943]
          - paragraph [ref=e334]: What the mascot does at each phase of an agent run.
          - generic [ref=e337]:
            - paragraph [ref=e340]: B · LIFECYCLE · 1 OF 5
            - heading "Listening — blink (36px)" [level=3] [ref=e944]
            - paragraph [ref=e345]: The user is still typing. The mascot is a small avatar inside the composer's status line, blinking at a natural rhythm. It does NOT spin or grow — presence, not pressure.
            - heading "Why this state" [level=5] [ref=e945]
            - list [ref=e350]:
              - listitem [ref=e351]: Eye = blink — natural cadence, never a spinner
              - listitem [ref=e352]: Soft bob is ON (4.2s breath cycle)
              - listitem [ref=e353]: Small (36px) — sits in the chrome, not the message
            - paragraph [ref=e357]:
              - strong [ref=e358]: "Avoid:"
              - text: Growing, smiling, or going to dot here. Save attentiveness for thinking.
          - generic [ref=e361]:
            - paragraph [ref=e364]: B · LIFECYCLE · 2 OF 5
            - heading "Planning — dot (56px)" [level=3] [ref=e946]
            - paragraph [ref=e369]: Before any tools fire, the agent is sketching a plan. Mascot sits in the message gutter at focus size; the dot eye signals sharp attention. The plan itself streams in next to it.
            - heading "Why this state" [level=5] [ref=e947]
            - list [ref=e374]:
              - listitem [ref=e375]: Eye = dot — sharp, alert, narrowed focus
              - listitem [ref=e376]: Bigger (56px) than listening — focal point of the message
              - listitem [ref=e377]: Sits LEFT of the plan, gutter-aligned
              - listitem [ref=e378]: Stays in this state until the first tool fires; then shrinks + becomes squint
            - paragraph [ref=e382]:
              - emphasis [ref=e383]: The plan is the message. The mascot is the byline.
          - generic [ref=e386]:
            - paragraph [ref=e389]: B · LIFECYCLE · 3 OF 5
            - heading "Working — squint / dot (16px)" [level=3] [ref=e948]
            - paragraph [ref=e394]: "The agent fires tools one at a time. Only the active step has the mascot — past steps get a checkmark. The eye shape tracks the kind of work: squint for search/read, dot for code/tool execution."
            - heading "Why this state" [level=5] [ref=e949]
            - list [ref=e399]:
              - listitem [ref=e400]: Scaled DOWN to 16px — matches the step checkbox
              - listitem [ref=e401]: squint for retrieval / scanning kinds of work
              - listitem [ref=e402]: dot when an active tool (code, terminal, write) is running
              - listitem [ref=e403]: Eye flickers between the two as tools chain inside one step
            - paragraph [ref=e407]:
              - strong [ref=e408]: "Avoid:"
              - text: Stacking multiple mascots. One active mascot at a time.
          - generic [ref=e411]:
            - paragraph [ref=e414]: B · LIFECYCLE · 4 OF 5
            - heading "Interrupt — wow + gold body (52px)" [level=3] [ref=e950]
            - paragraph [ref=e419]: The agent needs to come back with a question. This is the ONE moment the BODY changes color — navy shifts to gold. The eye opens wide (wow). It's the loudest signal in the system.
            - heading "Why this state" [level=5] [ref=e951]
            - list [ref=e424]:
              - listitem [ref=e425]: Body goes gold — the ONLY color change in the system
              - listitem [ref=e426]: Eye opens to wow (O O) — wide, attentive
              - listitem [ref=e427]: Scales UP to 52px and inhabits a stripe-gold card
            - paragraph [ref=e431]:
              - emphasis [ref=e432]: If the user walks away, the eye drifts to dot after ~30s (blocked → patient waiting). A nudge, not a tantrum.
          - generic [ref=e435]:
            - paragraph [ref=e438]: B · LIFECYCLE · 5 OF 5
            - heading "Delivered — happy → wink (22px)" [level=3] [ref=e952]
            - paragraph [ref=e443]: One beat of happy (^ ^, 280ms ease-out) on the "found" moment, then resolves to wink for the byline. The mascot does not stay happy — that would feel needy.
            - heading "Why this state" [level=5] [ref=e953]
            - list [ref=e448]:
              - listitem [ref=e449]: Scale drops to 22px — the answer is the hero
              - listitem [ref=e450]: Mascot sits in the byline beside step count + timing
              - listitem [ref=e451]: Wink reads as "satisfied", not "look at me"
              - listitem [ref=e452]: If user thumbs-up, eye briefly becomes heart (1.2s) before settling
            - paragraph [ref=e456]:
              - emphasis [ref=e457]: "Edge case — couldn't find: mascot resolves to blocked (gold dot), not error. xx is reserved for tool failures."
          - heading "C · Placement & Scale" [level=2] [ref=e954]
          - paragraph [ref=e464]: Where the mascot lives, and how big.
          - paragraph [ref=e467]:
            - strong [ref=e468]: "Rule:"
            - text: mascot scale ∝ how much the agent wants you to look.
