    - generic [ref=e131]:
      - banner [ref=e132]:
        - heading "Agentic Mascot Guidelines" [level=1] [ref=e136]
      - main [ref=e137]:
        - generic [ref=e138]:
          - paragraph [ref=e140]: The OpenSearch mascot is a single circular character with comma-shaped eyes. It communicates agent state through nine eye expressions and a scale ladder from 18px to 96px. The body never morphs — only the eyes change. Color shifts to gold only when the agent needs human input.
          - heading "A · Vocabulary" [level=2] [ref=e143]
          - paragraph [ref=e146]: One body, nine expressions — the alphabet the mascot uses.
          - generic [ref=e148]:
            - generic [ref=e150]:
              - img "mascot · comma" [ref=e151]:
                - img [ref=e152]
              - heading "COMMA" [level=4] [ref=e159]
              - paragraph [ref=e163]:
                - strong [ref=e164]: Rest / Idle / Streaming
              - paragraph [ref=e167]: The default resting state. Eyes relaxed, body neutral.
            - generic [ref=e169]:
              - img "mascot · blink" [ref=e170]:
                - img [ref=e171]
              - heading "BLINK" [level=4] [ref=e178]
              - paragraph [ref=e182]:
                - strong [ref=e183]: Ack / Listening
              - paragraph [ref=e186]: A brief close-and-open. Signals the mascot heard you.
            - generic [ref=e188]:
              - img "mascot · dot" [ref=e189]:
                - img [ref=e190]
              - heading "DOT" [level=4] [ref=e197]
              - paragraph [ref=e201]:
                - strong [ref=e202]: Alert / Thinking / Tool call
              - paragraph [ref=e205]: Focused dot pupils. The mascot is processing.
            - generic [ref=e207]:
              - img "mascot · squint" [ref=e208]:
                - img [ref=e209]
              - heading "SQUINT" [level=4] [ref=e216]
              - paragraph [ref=e220]:
                - strong [ref=e221]: Scan / Searching / Reading
              - paragraph [ref=e224]: Narrowed eyes. The mascot is reading or scanning content.
            - generic [ref=e226]:
              - img "mascot · happy" [ref=e227]:
                - img [ref=e228]
              - heading "HAPPY" [level=4] [ref=e235]
              - paragraph [ref=e239]:
                - strong [ref=e240]: Success / Found / Resolved
              - paragraph [ref=e243]: Upturned eyes. Something went well.
            - generic [ref=e245]:
              - img "mascot · wow" [ref=e246]:
                - img [ref=e247]
              - heading "WOW" [level=4] [ref=e254]
              - paragraph [ref=e258]:
                - strong [ref=e259]: Attention / Asking / Needs input
              - paragraph [ref=e262]: Wide eyes, body shifts gold. The mascot needs you.
            - generic [ref=e264]:
              - img "mascot · wink" [ref=e265]:
                - img [ref=e266]
              - heading "WINK" [level=4] [ref=e273]
              - paragraph [ref=e277]:
                - strong [ref=e278]: Closed / Done / Delivered
              - paragraph [ref=e281]: One eye shut. Task complete, signing off.
            - generic [ref=e283]:
              - img "mascot · heart" [ref=e284]:
                - img [ref=e285]
              - heading "HEART" [level=4] [ref=e292]
              - paragraph [ref=e296]:
                - strong [ref=e297]: Love / Pinned / Saved
              - paragraph [ref=e300]: Heart-shaped eyes. Something was saved or favorited.
            - generic [ref=e302]:
              - img "mascot · xx" [ref=e303]:
                - img [ref=e304]
              - heading "XX" [level=4] [ref=e311]
              - paragraph [ref=e315]:
                - strong [ref=e316]: Failed / Error / Cancelled
              - paragraph [ref=e319]: Crossed-out eyes. Something went wrong.
          - heading "B · Lifecycle" [level=2] [ref=e322]
          - paragraph [ref=e325]: What the mascot does at each phase of an agent run.
          - generic [ref=e328]:
            - paragraph [ref=e331]: B · LIFECYCLE · 1 OF 5
            - heading "Listening — blink (36px)" [level=3] [ref=e333]
            - paragraph [ref=e336]: The user is still typing. The mascot is a small avatar inside the composer's status line, blinking at a natural rhythm. It does NOT spin or grow — presence, not pressure.
            - heading "Why this state" [level=5] [ref=e338]
            - list [ref=e341]:
              - listitem [ref=e342]: Eye = blink — natural cadence, never a spinner
              - listitem [ref=e343]: Soft bob is ON (4.2s breath cycle)
              - listitem [ref=e344]: Small (36px) — sits in the chrome, not the message
            - paragraph [ref=e348]:
              - strong [ref=e349]: "Avoid:"
              - text: Growing, smiling, or going to dot here. Save attentiveness for thinking.
          - generic [ref=e352]:
            - paragraph [ref=e355]: B · LIFECYCLE · 2 OF 5
            - heading "Planning — dot (56px)" [level=3] [ref=e357]
            - paragraph [ref=e360]: Before any tools fire, the agent is sketching a plan. Mascot sits in the message gutter at focus size; the dot eye signals sharp attention. The plan itself streams in next to it.
            - heading "Why this state" [level=5] [ref=e362]
            - list [ref=e365]:
              - listitem [ref=e366]: Eye = dot — sharp, alert, narrowed focus
              - listitem [ref=e367]: Bigger (56px) than listening — focal point of the message
              - listitem [ref=e368]: Sits LEFT of the plan, gutter-aligned
              - listitem [ref=e369]: Stays in this state until the first tool fires; then shrinks + becomes squint
            - paragraph [ref=e373]:
              - emphasis [ref=e374]: The plan is the message. The mascot is the byline.
          - generic [ref=e377]:
            - paragraph [ref=e380]: B · LIFECYCLE · 3 OF 5
            - heading "Working — squint / dot (16px)" [level=3] [ref=e382]
            - paragraph [ref=e385]: "The agent fires tools one at a time. Only the active step has the mascot — past steps get a checkmark. The eye shape tracks the kind of work: squint for search/read, dot for code/tool execution."
            - heading "Why this state" [level=5] [ref=e387]
            - list [ref=e390]:
              - listitem [ref=e391]: Scaled DOWN to 16px — matches the step checkbox
              - listitem [ref=e392]: squint for retrieval / scanning kinds of work
              - listitem [ref=e393]: dot when an active tool (code, terminal, write) is running
              - listitem [ref=e394]: Eye flickers between the two as tools chain inside one step
            - paragraph [ref=e398]:
              - strong [ref=e399]: "Avoid:"
              - text: Stacking multiple mascots. One active mascot at a time.
          - generic [ref=e402]:
            - paragraph [ref=e405]: B · LIFECYCLE · 4 OF 5
            - heading "Interrupt — wow + gold body (52px)" [level=3] [ref=e407]
            - paragraph [ref=e410]: The agent needs to come back with a question. This is the ONE moment the BODY changes color — navy shifts to gold. The eye opens wide (wow). It's the loudest signal in the system.
            - heading "Why this state" [level=5] [ref=e412]
            - list [ref=e415]:
              - listitem [ref=e416]: Body goes gold — the ONLY color change in the system
              - listitem [ref=e417]: Eye opens to wow (O O) — wide, attentive
              - listitem [ref=e418]: Scales UP to 52px and inhabits a stripe-gold card
            - paragraph [ref=e422]:
              - emphasis [ref=e423]: If the user walks away, the eye drifts to dot after ~30s (blocked → patient waiting). A nudge, not a tantrum.
          - generic [ref=e426]:
            - paragraph [ref=e429]: B · LIFECYCLE · 5 OF 5
            - heading "Delivered — happy → wink (22px)" [level=3] [ref=e431]
            - paragraph [ref=e434]: One beat of happy (^ ^, 280ms ease-out) on the "found" moment, then resolves to wink for the byline. The mascot does not stay happy — that would feel needy.
            - heading "Why this state" [level=5] [ref=e436]
            - list [ref=e439]:
              - listitem [ref=e440]: Scale drops to 22px — the answer is the hero
              - listitem [ref=e441]: Mascot sits in the byline beside step count + timing
              - listitem [ref=e442]: Wink reads as "satisfied", not "look at me"
              - listitem [ref=e443]: If user thumbs-up, eye briefly becomes heart (1.2s) before settling
            - paragraph [ref=e447]:
              - emphasis [ref=e448]: "Edge case — couldn't find: mascot resolves to blocked (gold dot), not error. xx is reserved for tool failures."
          - heading "C · Placement & Scale" [level=2] [ref=e452]
          - paragraph [ref=e455]: Where the mascot lives, and how big.
          - paragraph [ref=e458]:
            - strong [ref=e459]: "Rule:"
            - text: mascot scale ∝ how much the agent wants you to look.
