          - heading "D · Micro-moments" [level=2] [ref=e568]
          - paragraph [ref=e571]: Small opinions on the in-betweens.
          - generic [ref=e573]:
            - generic [ref=e575]:
              - img "mascot · happy" [ref=e577]:
                - img [ref=e578]
              - heading "One beat of happy, never two" [level=4] [ref=e584]
              - paragraph [ref=e588]: On 'found', the eye flips to ^ ^ for 280ms with a subtle 4px hop, then resolves to wink. Repeating it more than once turns it into a tic. Once is satisfying; twice is annoying.
            - generic [ref=e590]:
              - img "mascot · wow" [ref=e592]:
                - img [ref=e593]
              - heading "Gold body, never gold eye" [level=4] [ref=e599]
              - paragraph [ref=e603]: The ONLY moment the body color changes is when a human is needed. After ~30s without response, the wow eye softens to dot — patient waiting. The gold body stays.
            - generic [ref=e605]:
              - img "mascot · xx" [ref=e607]:
                - img [ref=e608]
              - heading "xx flashes, then returns to comma" [level=4] [ref=e614]
              - paragraph [ref=e618]: X-eyes show for ~600ms after a tool failure, then settle back. The error itself lives in the message text — the mascot doesn't keep wearing it. The agent recovers.
            - generic [ref=e620]:
              - img "mascot · squint" [ref=e622]:
                - img [ref=e623]
              - heading "Eyes follow data, not the cursor" [level=4] [ref=e629]
              - paragraph [ref=e633]: During work, idle cursor-following is OFF. Eyes belong to the agent's attention, not the user's. Cursor-following turns back on only at idle, and only on the empty state.
            - generic [ref=e635]:
              - img "mascot · comma" [ref=e637]:
                - img [ref=e638]
              - heading "Idle blinks, never sleeps" [level=4] [ref=e644]
              - paragraph [ref=e648]: "At rest the mascot cycles micro-expressions: blink (40%), then dot/squint/happy/wow/wink. No xx in idle — sleeping AI is a lie. Cycle pauses while any tool runs."
            - generic [ref=e650]:
              - img "mascot · heart" [ref=e652]:
                - img [ref=e653]
              - heading "Heart eye is earned" [level=4] [ref=e659]
              - paragraph [ref=e663]: Reserved for when the USER acts — thumbs-up, pin-to-runbook, share. The agent never wears heart on its own. It's the user's affordance, not the agent's emotion.
          - heading "Principles" [level=2] [ref=e666]
          - paragraph [ref=e669]: Six rules the mascot follows.
          - generic [ref=e673]:
            - strong [ref=e676]: "1."
            - strong [ref=e679]: One mascot per message
            - paragraph [ref=e682]: Never show multiple mascots in the same context.
          - generic [ref=e686]:
            - strong [ref=e689]: "2."
            - strong [ref=e692]: Body is invariant
            - paragraph [ref=e695]: Only the eyes change. The body shape stays constant.
          - generic [ref=e699]:
            - strong [ref=e702]: "3."
            - strong [ref=e705]: Scale signals urgency
            - paragraph [ref=e708]: Bigger means more important. Smaller means background.
          - generic [ref=e712]:
            - strong [ref=e715]: "4."
            - strong [ref=e718]: State follows the current tool
            - paragraph [ref=e721]: The expression maps to what the agent is doing right now.
          - generic [ref=e725]:
            - strong [ref=e728]: "5."
            - strong [ref=e731]: Don't wear the result
            - paragraph [ref=e734]: The mascot reacts, then returns to neutral. It doesn't stay happy forever.
          - generic [ref=e738]:
            - strong [ref=e741]: "6."
            - strong [ref=e744]: Gold means human-needed
            - paragraph [ref=e747]: The only time the body color changes is when the agent needs your input.