        - main [ref=e260]:
          - generic [ref=e261]:
            - paragraph [ref=e263]: The OpenSearch mascot is a single circular character with comma-shaped eyes. It communicates agent state through nine eye expressions and a scale ladder from 18px to 96px. The body never morphs — only the eyes change. Color shifts to gold only when the agent needs human input.
            - heading [level=2] [ref=e909]: A · Vocabulary
            - paragraph [ref=e269]: One body, nine expressions — the alphabet the mascot uses.
            - generic [ref=e271]:
