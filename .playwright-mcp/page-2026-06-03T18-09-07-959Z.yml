                - heading [level=4] [ref=e947]: One beat of happy, never two
                - paragraph [ref=e711]: On 'found', the eye flips to ^ ^ for 280ms with a subtle 4px hop, then resolves to wink. Repeating it more than once turns it into a tic. Once is satisfying; twice is annoying.
              - generic [ref=e713]:
                - img [ref=e948]:
                  - img [ref=e716]
                - heading [level=4] [ref=e949]: Gold body, never gold eye
                - paragraph [ref=e726]: The ONLY moment the body color changes is when a human is needed. After ~30s without response, the wow eye softens to dot — patient waiting. The gold body stays.
              - generic [ref=e728]:
                - img [ref=e950]:
                  - img [ref=e731]
                - heading [level=4] [ref=e951]: xx flashes, then returns to comma
                - paragraph [ref=e741]: X-eyes show for ~600ms after a tool failure, then settle back. The error itself lives in the message text — the mascot doesn't keep wearing it. The agent recovers.
              - generic [ref=e743]:
                - img [ref=e952]:
                  - img [ref=e746]
                - heading [level=4] [ref=e953]: Eyes follow data, not the cursor
                - paragraph [ref=e756]: During work, idle cursor-following is OFF. Eyes belong to the agent's attention, not the user's. Cursor-following turns back on only at idle, and only on the empty state.
              - generic [ref=e758]:
                - img [ref=e954]:
                  - img [ref=e761]
                - heading [level=4] [ref=e955]: Idle blinks, never sleeps
                - paragraph [ref=e771]: "At rest the mascot cycles micro-expressions: blink (40%), then dot/squint/happy/wow/wink. No xx in idle — sleeping AI is a lie. Cycle pauses while any tool runs."
              - generic [ref=e773]:
                - img [ref=e956]:
                  - img [ref=e776]
                - heading [level=4] [ref=e957]: Heart eye is earned
                - paragraph [ref=e786]: Reserved for when the USER acts — thumbs-up, pin-to-runbook, share. The agent never wears heart on its own. It's the user's affordance, not the agent's emotion.
            - heading [level=2] [ref=e958]: Principles
            - paragraph [ref=e792]: Six rules the mascot follows.
            - generic [ref=e796]:
              - strong [ref=e799]: "1."
              - strong [ref=e802]: One mascot per message
              - paragraph [ref=e805]: Never show multiple mascots in the same context.
            - generic [ref=e809]:
