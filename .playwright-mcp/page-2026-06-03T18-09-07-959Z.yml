                - paragraph [ref=e309]: A brief close-and-open. Signals the mascot heard you.
              - generic [ref=e311]:
                - img [ref=e914]:
                  - img [ref=e313]
                - heading [level=4] [ref=e915]: DOT
                - paragraph [ref=e324]:
