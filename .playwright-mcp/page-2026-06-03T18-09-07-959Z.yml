              - strong [ref=e815]: Body is invariant
              - paragraph [ref=e818]: Only the eyes change. The body shape stays constant.
            - generic [ref=e822]:
              - strong [ref=e825]: "3."
              - strong [ref=e828]: Scale signals urgency
              - paragraph [ref=e831]: Bigger means more important. Smaller means background.
            - generic [ref=e835]:
              - strong [ref=e838]: "4."
              - strong [ref=e841]: State follows the current tool
              - paragraph [ref=e844]: The expression maps to what the agent is doing right now.
            - generic [ref=e848]:
              - strong [ref=e851]: "5."
              - strong [ref=e854]: Don't wear the result
              - paragraph [ref=e857]: The mascot reacts, then returns to neutral. It doesn't stay happy forever.
            - generic [ref=e861]:
