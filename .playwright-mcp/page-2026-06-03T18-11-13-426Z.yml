                - heading [level=4] [ref=e824]: One beat of happy, never two
                - paragraph [ref=e588]: On 'found', the eye flips to ^ ^ for 280ms with a subtle 4px hop, then resolves to wink. Repeating it more than once turns it into a tic. Once is satisfying; twice is annoying.
              - generic [ref=e590]:
                - img [ref=e825]:
                  - img [ref=e593]
                - heading [level=4] [ref=e826]: Gold body, never gold eye
                - paragraph [ref=e603]: The ONLY moment the body color changes is when a human is needed. After ~30s without response, the wow eye softens to dot — patient waiting. The gold body stays.
              - generic [ref=e605]:
                - img [ref=e827]:
                  - img [ref=e608]
                - heading [level=4] [ref=e828]: xx flashes, then returns to comma
                - paragraph [ref=e618]: X-eyes show for ~600ms after a tool failure, then settle back. The error itself lives in the message text — the mascot doesn't keep wearing it. The agent recovers.
              - generic [ref=e620]:
                - img [ref=e829]:
                  - img [ref=e623]
                - heading [level=4] [ref=e830]: Eyes follow data, not the cursor
                - paragraph [ref=e633]: During work, idle cursor-following is OFF. Eyes belong to the agent's attention, not the user's. Cursor-following turns back on only at idle, and only on the empty state.
              - generic [ref=e635]:
                - img [ref=e831]:
                  - img [ref=e638]
                - heading [level=4] [ref=e832]: Idle blinks, never sleeps
                - paragraph [ref=e648]: "At rest the mascot cycles micro-expressions: blink (40%), then dot/squint/happy/wow/wink. No xx in idle — sleeping AI is a lie. Cycle pauses while any tool runs."
              - generic [ref=e650]:
                - img [ref=e833]:
