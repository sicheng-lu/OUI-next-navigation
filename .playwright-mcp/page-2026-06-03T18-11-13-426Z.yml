                - heading [level=4] [ref=e834]: Heart eye is earned
                - paragraph [ref=e663]: Reserved for when the USER acts — thumbs-up, pin-to-runbook, share. The agent never wears heart on its own. It's the user's affordance, not the agent's emotion.
