      - banner [ref=e255]:
        - heading "Agentic Mascot Guidelines" [level=1] [ref=e1026]
      - main [ref=e260]:
        - generic [ref=e261]:
          - paragraph [ref=e263]: The OpenSearch mascot is a single circular character with comma-shaped eyes. It communicates agent state through nine eye expressions and a scale ladder from 18px to 96px. The body never morphs — only the eyes change. Color shifts to gold only when the agent needs human input.
          - heading "A · Vocabulary" [level=2] [ref=e1027]
          - paragraph [ref=e269]: One body, nine expressions — the alphabet the mascot uses.
          - generic [ref=e271]:
            - generic [ref=e273]:
              - img "mascot · comma" [ref=e1028]:
                - img [ref=e275]
              - heading "COMMA" [level=4] [ref=e1029]
              - paragraph [ref=e286]:
                - strong [ref=e287]: Rest / Idle / Streaming
              - paragraph [ref=e290]: The default resting state. Eyes relaxed, body neutral.
            - generic [ref=e292]:
              - img "mascot · blink" [ref=e1030]:
                - img [ref=e294]
              - heading "BLINK" [level=4] [ref=e1031]
              - paragraph [ref=e305]:
                - strong [ref=e306]: Ack / Listening
              - paragraph [ref=e309]: A brief close-and-open. Signals the mascot heard you.
            - generic [ref=e311]:
              - img "mascot · dot" [ref=e1032]:
                - img [ref=e313]
              - heading "DOT" [level=4] [ref=e1033]
              - paragraph [ref=e324]:
                - strong [ref=e325]: Alert / Thinking / Tool call
              - paragraph [ref=e328]: Focused dot pupils. The mascot is processing.
            - generic [ref=e330]:
              - img "mascot · squint" [ref=e1034]:
                - img [ref=e332]
              - heading "SQUINT" [level=4] [ref=e1035]
              - paragraph [ref=e343]:
                - strong [ref=e344]: Scan / Searching / Reading
              - paragraph [ref=e347]: Narrowed eyes. The mascot is reading or scanning content.
            - generic [ref=e349]:
              - img "mascot · happy" [ref=e1036]:
                - img [ref=e351]
              - heading "HAPPY" [level=4] [ref=e1037]
              - paragraph [ref=e362]:
                - strong [ref=e363]: Success / Found / Resolved
              - paragraph [ref=e366]: Upturned eyes. Something went well.
            - generic [ref=e368]:
              - img "mascot · wow" [ref=e1038]:
                - img [ref=e370]
              - heading "WOW" [level=4] [ref=e1039]
              - paragraph [ref=e381]:
                - strong [ref=e382]: Attention / Asking / Needs input
              - paragraph [ref=e385]: Wide eyes, body shifts gold. The mascot needs you.
            - generic [ref=e387]:
              - img "mascot · wink" [ref=e1040]:
                - img [ref=e389]
              - heading "WINK" [level=4] [ref=e1041]
              - paragraph [ref=e400]:
                - strong [ref=e401]: Closed / Done / Delivered
              - paragraph [ref=e404]: One eye shut. Task complete, signing off.
            - generic [ref=e406]:
              - img "mascot · heart" [ref=e1042]:
                - img [ref=e408]
              - heading "HEART" [level=4] [ref=e1043]
              - paragraph [ref=e419]:
                - strong [ref=e420]: Love / Pinned / Saved
              - paragraph [ref=e423]: Heart-shaped eyes. Something was saved or favorited.
            - generic [ref=e425]:
              - img "mascot · xx" [ref=e1044]:
