              - paragraph [ref=e442]: Crossed-out eyes. Something went wrong.
          - heading "B · Lifecycle" [level=2] [ref=e1046]
          - paragraph [ref=e448]: What the mascot does at each phase of an agent run.
          - generic [ref=e451]:
            - paragraph [ref=e454]: B · LIFECYCLE · 1 OF 5
            - heading "Listening — blink (36px)" [level=3] [ref=e1047]
            - paragraph [ref=e459]: The user is still typing. The mascot is a small avatar inside the composer's status line, blinking at a natural rhythm. It does NOT spin or grow — presence, not pressure.
            - heading "Why this state" [level=5] [ref=e1048]
            - list [ref=e464]:
              - listitem [ref=e465]: Eye = blink — natural cadence, never a spinner
              - listitem [ref=e466]: Soft bob is ON (4.2s breath cycle)
              - listitem [ref=e467]: Small (36px) — sits in the chrome, not the message
            - paragraph [ref=e471]:
              - strong [ref=e472]: "Avoid:"
              - text: Growing, smiling, or going to dot here. Save attentiveness for thinking.
          - generic [ref=e475]:
            - paragraph [ref=e478]: B · LIFECYCLE · 2 OF 5
            - heading "Planning — dot (56px)" [level=3] [ref=e1049]
            - paragraph [ref=e483]: Before any tools fire, the agent is sketching a plan. Mascot sits in the message gutter at focus size; the dot eye signals sharp attention. The plan itself streams in next to it.
            - heading "Why this state" [level=5] [ref=e1050]
            - list [ref=e488]:
              - listitem [ref=e489]: Eye = dot — sharp, alert, narrowed focus
              - listitem [ref=e490]: Bigger (56px) than listening — focal point of the message
              - listitem [ref=e491]: Sits LEFT of the plan, gutter-aligned
              - listitem [ref=e492]: Stays in this state until the first tool fires; then shrinks + becomes squint
            - paragraph [ref=e496]:
              - emphasis [ref=e497]: The plan is the message. The mascot is the byline.
          - generic [ref=e500]:
            - paragraph [ref=e503]: B · LIFECYCLE · 3 OF 5
            - heading "Working — squint / dot (16px)" [level=3] [ref=e1051]
            - paragraph [ref=e508]: "The agent fires tools one at a time. Only the active step has the mascot — past steps get a checkmark. The eye shape tracks the kind of work: squint for search/read, dot for code/tool execution."
            - heading "Why this state" [level=5] [ref=e1052]
            - list [ref=e513]:
              - listitem [ref=e514]: Scaled DOWN to 16px — matches the step checkbox
              - listitem [ref=e515]: squint for retrieval / scanning kinds of work
              - listitem [ref=e516]: dot when an active tool (code, terminal, write) is running
              - listitem [ref=e517]: Eye flickers between the two as tools chain inside one step
            - paragraph [ref=e521]:
              - strong [ref=e522]: "Avoid:"
              - text: Stacking multiple mascots. One active mascot at a time.
          - generic [ref=e525]:
            - paragraph [ref=e528]: B · LIFECYCLE · 4 OF 5
            - heading "Interrupt — wow + gold body (52px)" [level=3] [ref=e1053]
            - paragraph [ref=e533]: The agent needs to come back with a question. This is the ONE moment the BODY changes color — navy shifts to gold. The eye opens wide (wow). It's the loudest signal in the system.
            - heading "Why this state" [level=5] [ref=e1054]
            - list [ref=e538]:
              - listitem [ref=e539]: Body goes gold — the ONLY color change in the system
              - listitem [ref=e540]: Eye opens to wow (O O) — wide, attentive
              - listitem [ref=e541]: Scales UP to 52px and inhabits a stripe-gold card
            - paragraph [ref=e545]:
              - emphasis [ref=e546]: If the user walks away, the eye drifts to dot after ~30s (blocked → patient waiting). A nudge, not a tantrum.
          - generic [ref=e549]:
            - paragraph [ref=e552]: B · LIFECYCLE · 5 OF 5
            - heading "Delivered — happy → wink (22px)" [level=3] [ref=e1055]
            - paragraph [ref=e557]: One beat of happy (^ ^, 280ms ease-out) on the "found" moment, then resolves to wink for the byline. The mascot does not stay happy — that would feel needy.
            - heading "Why this state" [level=5] [ref=e1056]
            - list [ref=e562]:
              - listitem [ref=e563]: Scale drops to 22px — the answer is the hero
              - listitem [ref=e564]: Mascot sits in the byline beside step count + timing
              - listitem [ref=e565]: Wink reads as "satisfied", not "look at me"
              - listitem [ref=e566]: If user thumbs-up, eye briefly becomes heart (1.2s) before settling
            - paragraph [ref=e570]:
              - emphasis [ref=e571]: "Edge case — couldn't find: mascot resolves to blocked (gold dot), not error. xx is reserved for tool failures."
          - heading "C · Placement & Scale" [level=2] [ref=e1057]
          - paragraph [ref=e578]: Where the mascot lives, and how big.
          - paragraph [ref=e581]:
            - strong [ref=e582]: "Rule:"
            - text: mascot scale ∝ how much the agent wants you to look.
