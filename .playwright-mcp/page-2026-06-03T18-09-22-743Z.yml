          - heading "D · Micro-moments" [level=2] [ref=e1063]
          - paragraph [ref=e694]: Small opinions on the in-betweens.
          - generic [ref=e696]:
            - generic [ref=e698]:
              - img "mascot · happy" [ref=e1064]:
                - img [ref=e701]
              - heading "One beat of happy, never two" [level=4] [ref=e1065]
              - paragraph [ref=e711]: On 'found', the eye flips to ^ ^ for 280ms with a subtle 4px hop, then resolves to wink. Repeating it more than once turns it into a tic. Once is satisfying; twice is annoying.
            - generic [ref=e713]:
              - img "mascot · wow" [ref=e1066]:
                - img [ref=e716]
              - heading "Gold body, never gold eye" [level=4] [ref=e1067]
              - paragraph [ref=e726]: The ONLY moment the body color changes is when a human is needed. After ~30s without response, the wow eye softens to dot — patient waiting. The gold body stays.
            - generic [ref=e728]:
              - img "mascot · xx" [ref=e1068]:
                - img [ref=e731]
              - heading "xx flashes, then returns to comma" [level=4] [ref=e1069]
              - paragraph [ref=e741]: X-eyes show for ~600ms after a tool failure, then settle back. The error itself lives in the message text — the mascot doesn't keep wearing it. The agent recovers.
            - generic [ref=e743]:
              - img "mascot · squint" [ref=e1070]:
                - img [ref=e746]
              - heading "Eyes follow data, not the cursor" [level=4] [ref=e1071]
              - paragraph [ref=e756]: During work, idle cursor-following is OFF. Eyes belong to the agent's attention, not the user's. Cursor-following turns back on only at idle, and only on the empty state.
            - generic [ref=e758]:
              - img "mascot · comma" [ref=e1072]:
                - img [ref=e761]
              - heading "Idle blinks, never sleeps" [level=4] [ref=e1073]
              - paragraph [ref=e771]: "At rest the mascot cycles micro-expressions: blink (40%), then dot/squint/happy/wow/wink. No xx in idle — sleeping AI is a lie. Cycle pauses while any tool runs."
            - generic [ref=e773]:
              - img "mascot · heart" [ref=e1074]:
                - img [ref=e776]
              - heading "Heart eye is earned" [level=4] [ref=e1075]
              - paragraph [ref=e786]: Reserved for when the USER acts — thumbs-up, pin-to-runbook, share. The agent never wears heart on its own. It's the user's affordance, not the agent's emotion.
          - heading "Principles" [level=2] [ref=e1076]
          - paragraph [ref=e792]: Six rules the mascot follows.
          - generic [ref=e796]:
            - strong [ref=e799]: "1."
            - strong [ref=e802]: One mascot per message
            - paragraph [ref=e805]: Never show multiple mascots in the same context.
          - generic [ref=e809]:
            - strong [ref=e812]: "2."
            - strong [ref=e815]: Body is invariant
            - paragraph [ref=e818]: Only the eyes change. The body shape stays constant.
          - generic [ref=e822]:
            - strong [ref=e825]: "3."
            - strong [ref=e828]: Scale signals urgency
            - paragraph [ref=e831]: Bigger means more important. Smaller means background.
          - generic [ref=e835]:
            - strong [ref=e838]: "4."
            - strong [ref=e841]: State follows the current tool
            - paragraph [ref=e844]: The expression maps to what the agent is doing right now.
          - generic [ref=e848]:
            - strong [ref=e851]: "5."
            - strong [ref=e854]: Don't wear the result
            - paragraph [ref=e857]: The mascot reacts, then returns to neutral. It doesn't stay happy forever.
          - generic [ref=e861]:
            - strong [ref=e864]: "6."
            - strong [ref=e867]: Gold means human-needed
            - paragraph [ref=e870]: The only time the body color changes is when the agent needs your input.