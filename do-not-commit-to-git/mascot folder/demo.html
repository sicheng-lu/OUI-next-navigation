<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mascot · demo</title>
  <link rel="stylesheet" href="mascot.css" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #0B0E12;
      color: #C8D1DA;
      font-family: ui-monospace, "JetBrains Mono", Menlo, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
      padding: 48px 24px;
    }
    h1 { font-weight: 500; letter-spacing: 0.04em; font-size: 14px; text-transform: uppercase; color: #7B96A9; margin: 0; }
    .row { display: flex; align-items: flex-end; gap: 32px; flex-wrap: wrap; justify-content: center; }
    .cell { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .cell-label { font-size: 11px; color: #5C6773; letter-spacing: 0.04em; }
    button.expr {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.08);
      color: #C8D1DA;
      padding: 6px 12px;
      font: inherit;
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      transition: border-color 150ms, background 150ms;
    }
    button.expr:hover { border-color: #7B96A9; }
    button.expr.on { border-color: #7B96A9; background: rgba(123,150,169,0.12); }
    .expr-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; max-width: 720px; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <h1>Mascot · drop-in demo</h1>
  <div id="root"></div>

  <script type="text/babel" src="Mascot.jsx"></script>
  <script type="text/babel">
    const { useState } = React;

    function Demo() {
      const [locked, setLocked] = useState(null);
      const expr = locked || "comma";

      return (
        <>
          <window.Mascot size={240} expression={expr} idle={locked === null} />

          <div className="expr-row">
            <button
              className={`expr ${locked === null ? "on" : ""}`}
              onClick={() => setLocked(null)}>
              auto
            </button>
            {window.EXPRESSIONS.map((e) => (
              <button
                key={e.id}
                className={`expr ${locked === e.id ? "on" : ""}`}
                onClick={() => setLocked(e.id)}>
                {e.label}
              </button>
            ))}
          </div>

          {/* Size ramp — illustrates the small-size legibility curve. */}
          <div className="row">
            {[160, 96, 56, 40, 28, 20].map((s) => (
              <div key={s} className="cell">
                <window.Mascot
                  size={s}
                  expression={expr}
                  idle={locked === null}
                  bob={false} />
                <span className="cell-label">{s}px</span>
              </div>
            ))}
          </div>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
  </script>
</body>
</html>
